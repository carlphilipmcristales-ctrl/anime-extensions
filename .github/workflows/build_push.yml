name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build xnxx extension
        run: ./gradlew :src:all:xnxx:assembleDebug

      - name: Generate index.min.json
        run: |
          pip install --upgrade --break-system-packages "protobuf>=7.35.1"
          mkdir -p apk-artifacts repo
          find src/all/xnxx/build -name "*.apk" -exec cp {} apk-artifacts/ \;
          find src/all/xnxx/build -name "keiyoushi-source-info.json" -exec cp {} apk-artifacts/ \;
          python ./.github/scripts/publish-repo.py "false" "true"

      - name: Push to repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: ./repo
