name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build xnxx extension
        run: ./gradlew :src:all:xnxx:assembleDebug

      - name: Prepare repo output
        run: |
          mkdir -p repo_out/apk repo_out/icon
          cp src/all/xnxx/build/outputs/apk/debug/*.apk repo_out/apk/
          cp src/all/xnxx/res/mipmap-xxhdpi/*.png repo_out/icon/ 2>/dev/null || true

      - name: Generate index.min.json
        run: |
          pip install protobuf
          mkdir -p apk-artifacts
          cp repo_out/apk/*.apk apk-artifacts/
          mkdir -p repo
          python ./.github/scripts/publish-repo.py "false" "true"

      - name: Push to repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: ./repo
