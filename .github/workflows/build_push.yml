name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build xnxx extension
        run: ./gradlew :src:all:xnxx:assembleDebug

      - name: Package repo files
        run: |
          mkdir -p repo/apk repo/icon
          APK_FILE=$(find src/all/xnxx/build -name "*.apk" | head -n 1)
          APK_NAME=$(basename "$APK_FILE")
          cp "$APK_FILE" "repo/apk/$APK_NAME"
          ICON_FILE=$(find src/all/xnxx/res -name "ic_launcher.png" | tail -n 1)
          if [ -n "$ICON_FILE" ]; then
            cp "$ICON_FILE" "repo/icon/eu.kanade.tachiyomi.animeextension.all.xnxx.png"
          fi
          python3 -c "
          import json
          data = [{
              'name': 'Aniyomi: XNXX',
              'pkg': 'eu.kanade.tachiyomi.animeextension.all.xnxx',
              'apk': '$APK_NAME',
              'lang': 'all',
              'code': 5,
              'version': '14.5',
              'nsfw': 1,
              'sources': [{
                  'name': 'XNXX',
                  'lang': 'all',
                  'id': '6355427640238282940',
                  'baseUrl': 'https://xnxx.xxx'
              }]
          }]
          with open('repo/index.min.json', 'w') as f:
              json.dump(data, f)
          "

      - name: Push to repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: ./repo
